name: Desktop Build

on:
  workflow_call:
    inputs:
      publish:
        description: Upload build artifacts
        type: boolean
        default: false
      build_version:
        description: Kubikles build version
        type: string
        default: dev

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"
  NODE_VERSION: "22.23.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Test
        run: make test

      - name: TypeScript typecheck
        run: make typecheck

      - name: Build frontend (for go vet embed)
        run: make appicon && cd frontend && npx vite build

      - name: Go vet
        run: go vet -tags "helm webkit2_41" ./...

      - name: Install Helm
        shell: bash
        run: |
          set -euo pipefail
          helm_tools="$RUNNER_TEMP/accelerator-contract-tools"
          helm_archive="$RUNNER_TEMP/helm-v3.21.3-linux-amd64.tar.gz"
          mkdir -m 700 "$helm_tools"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz -o "$helm_archive"
          printf '%s  %s\n' '15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0' "$helm_archive" | sha256sum --check --status
          tar -xzf "$helm_archive" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$helm_tools/helm"
          [ "$("$helm_tools/helm" version --short)" = 'v3.21.3+g1ad6e68' ]
          printf '%s\n' "$helm_tools" >> "$GITHUB_PATH"

      - name: Test Accelerator release tooling
        run: make test-accelerator-release-contract

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: make install-wails

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build
        run: make build-linux-amd64 BUILD_VERSION='${{ inputs.build_version }}'

      - name: Zip binary
        if: inputs.publish
        run: cd build/bin && zip Kubikles-linux-amd64.zip Kubikles-linux-amd64

      - name: Upload artifact
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubikles-linux-amd64
          path: build/bin/Kubikles-linux-amd64.zip

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: make install-wails

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build
        shell: bash
        run: |
          make build-windows-amd64 BUILD_VERSION='${{ inputs.build_version }}'
          make build-windows-arm64 BUILD_VERSION='${{ inputs.build_version }}'

      - name: Zip binaries
        if: inputs.publish
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/Kubikles-amd64.exe -DestinationPath build/bin/Kubikles-windows-amd64.zip
          Compress-Archive -Path build/bin/Kubikles-arm64.exe -DestinationPath build/bin/Kubikles-windows-arm64.zip

      - name: Upload amd64 artifact
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubikles-windows-amd64
          path: build/bin/Kubikles-windows-amd64.zip

      - name: Upload arm64 artifact
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubikles-windows-arm64
          path: build/bin/Kubikles-windows-arm64.zip

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: make install-wails

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build arm64
        run: |
          make build-mac-arm BUILD_VERSION='${{ inputs.build_version }}'
          mv build/bin/kubikles.app build/bin/Kubikles-arm64.app

      - name: Build amd64
        run: |
          make build-mac BUILD_VERSION='${{ inputs.build_version }}'
          mv build/bin/kubikles.app build/bin/Kubikles-amd64.app

      - name: Zip apps
        if: inputs.publish
        run: |
          cat > build/bin/README.txt <<'EOF'
          Kubikles for macOS (unsigned build)
          ====================================

          This build is not code-signed. macOS will block it by default.

          Before opening the app, run this in Terminal:

              xattr -d com.apple.quarantine Kubikles-*.app

          Or: right-click the app > Open > click Open in the dialog.
          EOF
          cd build/bin
          echo "Build output:" && ls -la
          # Fail fast if builds didn't produce .app bundles
          test -d Kubikles-arm64.app || { echo "ERROR: Kubikles-arm64.app not found"; exit 1; }
          test -d Kubikles-amd64.app || { echo "ERROR: Kubikles-amd64.app not found"; exit 1; }
          zip -r Kubikles-macos-arm64.zip Kubikles-arm64.app README.txt
          zip -r Kubikles-macos-amd64.zip Kubikles-amd64.app README.txt

      - name: Upload arm64 artifact
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubikles-macos-arm64
          path: build/bin/Kubikles-macos-arm64.zip

      - name: Upload amd64 artifact
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubikles-macos-amd64
          path: build/bin/Kubikles-macos-amd64.zip
