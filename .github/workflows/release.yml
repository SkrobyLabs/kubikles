name: Release

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - "**"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      build_version: ${{ steps.release.outputs.build_version }}
      chart_version: ${{ steps.release.outputs.chart_version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
      source_epoch: ${{ steps.release.outputs.source_epoch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: release
        name: Verify exact stable release identity
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Error: release tag must be canonical vMAJOR.MINOR.PATCH" >&2; exit 1; }
          commit="$(go run ./scripts/accelerator-release verify-git . "$tag")"
          {
            echo "build_version=$tag"
            echo "chart_version=${tag#v}"
            echo "source_commit=$commit"
            echo "source_epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      publish: true
      build_version: ${{ needs.preflight.outputs.build_version }}

  accelerator:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.36.0
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install checksum-pinned release tools
        shell: bash
        run: ./scripts/install-accelerator-release-tools.sh "$RUNNER_TEMP/accelerator-tools"
      - name: Publish or verify immutable Accelerator artifacts
        env:
          BUILD_VERSION: ${{ needs.preflight.outputs.build_version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
          GH_TOKEN: ${{ github.token }}
          ACCELERATOR_RELEASE_OUTPUT: ${{ runner.temp }}/accelerator-release
        run: |
          export PATH="$RUNNER_TEMP/accelerator-tools:$PATH"
          ./scripts/publish-accelerator-release.sh ghcr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubikles-accelerator-release
          path: ${{ runner.temp }}/accelerator-release/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [preflight, build, accelerator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Install checksum-pinned release tools
        run: ./scripts/install-accelerator-release-tools.sh "$RUNNER_TEMP/accelerator-tools"
      - name: Finalize immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.preflight.outputs.build_version }}
        shell: bash
        run: |
          set -euo pipefail
          github_token="$GH_TOKEN"
          unset GH_TOKEN
          github_cli() { GH_TOKEN="$github_token" gh "$@"; }
          export PATH="$RUNNER_TEMP/accelerator-tools:$PATH"
          gh_config="$(mktemp -d "$RUNNER_TEMP/accelerator-gh.XXXXXX")"
          chmod 700 "$gh_config"
          : > "$gh_config/config.yml"
          chmod 600 "$gh_config/config.yml"
          export GH_CONFIG_DIR="$gh_config"
          trap 'rm -rf "$gh_config"' EXIT
          tag="$BUILD_VERSION"
          descriptor="$RUNNER_TEMP/artifacts/kubikles-accelerator-release/kubikles-accelerator-release-$tag.json"
          checksum="$descriptor.sha256"
          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          find "$RUNNER_TEMP/artifacts" -type f -printf '%f\n' | LC_ALL=C sort > "$expected_assets"
          go run ./scripts/accelerator-release verify-release-assets "$tag" "$expected_assets"
          [ "$(github_cli api "repos/${{ github.repository }}" --jq .full_name)" = '${{ github.repository }}' ] || { echo "Error: repository access failed" >&2; exit 1; }
          classify_release() {
            local output error_file metadata release_tag release_name release_draft release_prerelease
            error_file="$(mktemp "$RUNNER_TEMP/release-state.XXXXXX")"
            if output="$(github_cli api "repos/${{ github.repository }}/releases/tags/$tag" --jq '([.tag_name, .name, .draft, .prerelease] | @tsv), (.assets[].name)' 2>"$error_file")"; then
              rm -f "$error_file"
              metadata="$(printf '%s\n' "$output" | sed -n '1p')"
              IFS=$'\t' read -r release_tag release_name release_draft release_prerelease <<< "$metadata"
              [ "$release_tag" = "$tag" ] || { echo "Error: finalized Release tag differs" >&2; exit 1; }
              [ "$release_name" = "$tag" ] || { echo "Error: finalized Release name differs" >&2; exit 1; }
              [ "$release_draft" = false ] || { echo "Error: finalized Release must not be a draft" >&2; exit 1; }
              [ "$release_prerelease" = false ] || { echo "Error: finalized Release must not be a prerelease" >&2; exit 1; }
              printf '%s\n' "$output" | sed '1d' > "$RUNNER_TEMP/finalized-assets.txt"
              go run ./scripts/accelerator-release verify-release-assets "$tag" "$RUNNER_TEMP/finalized-assets.txt"
              printf 'existing\n'
            elif grep -Eq '\(HTTP 404\)$' "$error_file"; then
              rm -f "$error_file"
              printf 'absent\n'
            else
              rm -f "$error_file"
              echo "Error: GitHub Release could not be classified authoritatively" >&2
              exit 1
            fi
          }
          release_state="$(classify_release)"
          if [ "$release_state" = existing ]; then
            tmp="$(mktemp -d "$RUNNER_TEMP/finalized-release.XXXXXX")"; chmod 700 "$tmp"
            github_cli release download "$tag" --pattern "kubikles-accelerator-release-$tag.json" --dir "$tmp"
            github_cli release download "$tag" --pattern "kubikles-accelerator-release-$tag.json.sha256" --dir "$tmp"
            cmp "$descriptor" "$tmp/$(basename "$descriptor")" >/dev/null || { echo "Error: finalized Release descriptor conflicts" >&2; exit 1; }
            cmp "$checksum" "$tmp/$(basename "$checksum")" >/dev/null || { echo "Error: finalized Release checksum conflicts" >&2; exit 1; }
          else
            notes="$RUNNER_TEMP/accelerator-release-notes.md"
            github_cli api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" --jq '.body' > "$notes"
            cat >> "$notes" <<'NOTES'

          ---

          ## Downloads

          | Platform | Architecture | File |
          |----------|-------------|------|
          | Windows | x64 | `Kubikles-windows-amd64.zip` |
          | Windows | ARM64 | `Kubikles-windows-arm64.zip` |
          | macOS | Apple Silicon | `Kubikles-macos-arm64.zip` |
          | macOS | Intel | `Kubikles-macos-amd64.zip` |
          | Linux | x64 | `Kubikles-linux-amd64.zip` |

          > **macOS users:** see `README.txt` inside the zip for instructions on running unsigned builds.
          NOTES
            commit="$(go run ./scripts/accelerator-release verify-git . "$tag" '${{ needs.preflight.outputs.source_commit }}')"
            [ "$(github_cli api "repos/${{ github.repository }}/commits/$tag" --jq .sha)" = "$commit" ] || { echo "Error: GitHub tag source moved before finalization" >&2; exit 1; }
            [ "$(classify_release)" = absent ] || { echo "Error: Release appeared after preflight; refusing to mutate it" >&2; exit 1; }
            github_cli release create "$tag" --title "$tag" -F "$notes" "$RUNNER_TEMP"/artifacts/*/*.zip "$descriptor" "$checksum"
            [ "$(classify_release)" = existing ] || { echo "Error: finalized Release read-back failed" >&2; exit 1; }
          fi
      - name: Verify public exact release handoff
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.preflight.outputs.build_version }}
        run: |
          export PATH="$RUNNER_TEMP/accelerator-tools:$PATH"
          make verify-accelerator-release-ghcr BUILD_VERSION="$BUILD_VERSION"
